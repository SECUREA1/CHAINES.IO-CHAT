<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CHAINeS Composer social sharing card</title>
  <desc id="desc">A professional blue and gold CHAINeS Composer header graphic with logo and slogan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.46" stop-color="#0d3f86"/>
      <stop offset="1" stop-color="#06152f"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="24%" cy="28%" r="58%">
      <stop offset="0" stop-color="#1d7dff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#1d7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="84%" cy="56%" r="48%">
      <stop offset="0" stop-color="#e5b35c" stop-opacity="0.38"/>
