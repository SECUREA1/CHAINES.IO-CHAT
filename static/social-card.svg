<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CHAINeS POST social sharing card</title>
  <desc id="desc">A professional blue and gold CHAINeS POST header graphic with logo and slogan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.46" stop-color="#142d52"/>
      <stop offset="1" stop-color="#06152f"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="24%" cy="28%" r="58%">
      <stop offset="0" stop-color="#1d7dff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#1d7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="84%" cy="56%" r="48%">
      <stop offset="0" stop-color="#e5b35c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e5b35c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <path d="M95 470 C230 330 360 565 505 385 S760 510 920 310 S1095 345 1155 255" fill="none" stroke="#91c3ff" stroke-width="5" stroke-opacity="0.32"/>
  <g fill="#e5b35c" opacity="0.92">
    <circle cx="160" cy="408" r="10"/><circle cx="300" cy="356" r="10"/><circle cx="444" cy="455" r="10"/><circle cx="592" cy="342" r="10"/><circle cx="745" cy="420" r="10"/><circle cx="910" cy="310" r="10"/><circle cx="1045" cy="350" r="10"/>
  </g>
  <rect x="70" y="70" width="1060" height="490" rx="34" fill="rgba(4,15,35,0.52)" stroke="#e5b35c" stroke-width="4"/>
  <rect x="92" y="92" width="1016" height="446" rx="26" fill="none" stroke="#75b7ff" stroke-width="2" stroke-opacity="0.55"/>
<svg x="115" y="145" width="200" height="200" viewBox="0 0 100 100" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">CHAINeS POST</title>
  <desc id="logo-desc">Interlocking silver and gold chain links on a midnight blue badge.</desc>
  <defs>
    <linearGradient id="badge" x2="1" y2="1"><stop stop-color="#1c3d68"/><stop offset="1" stop-color="#091427"/></linearGradient>
    <linearGradient id="silver" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#8fc9f5"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0c2"/><stop offset="1" stop-color="#d49c45"/></linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="97" height="97" rx="25" fill="url(#badge)" stroke="#e5b35c" stroke-width="2"/>
  <rect x="8" y="8" width="84" height="84" rx="20" fill="none" stroke="#6e91b8" stroke-opacity=".3"/>
  <g transform="rotate(-38 50 50)" fill="none" stroke-width="8" stroke-linecap="round">
    <rect x="20" y="35" width="40" height="30" rx="15" stroke="url(#silver)"/>
    <rect x="40" y="35" width="40" height="30" rx="15" stroke="url(#gold)"/>
    <path d="M39 35h6a15 15 0 0 1 13 7" stroke="url(#silver)"/>
  </g>
  <circle cx="77" cy="24" r="3" fill="#f5d48b"/>
</svg>

  <g font-family="Poppins, Inter, Arial, sans-serif">
    <text x="390" y="210" font-size="86" font-weight="800" letter-spacing="1" fill="#ffffff">CHAINeS</text>
    <text x="394" y="282" font-size="54" font-weight="800" fill="#e5b35c">POST</text>
    <text x="394" y="358" font-size="38" font-weight="700" fill="#f5f8ff">Create. Share. Stream. Discover.</text>
    <text x="394" y="414" font-size="26" fill="#d6e5ff">A blue creator network for multimedia posts, live moments,</text>
    <text x="394" y="451" font-size="26" fill="#d6e5ff">marketplace drops, and secure community conversations.</text>
    <rect x="394" y="493" width="504" height="58" rx="29" fill="#071a3d" stroke="#e5b35c" stroke-opacity="0.7"/>
    <text x="426" y="531" font-size="24" font-weight="700" fill="#ffffff">chaines.io  •  Connected creator community</text>
  </g>
</svg>
