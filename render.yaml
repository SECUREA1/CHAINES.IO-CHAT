services:
  # Static site for the HTML
  - type: web
    name: chaines-chat-site
    runtime: static
    repo: https://github.com/SECUREA1/CHAINES.IO-CHAT.git
    branch: main
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /secure
        destination: /secure.html
      - type: rewrite
        source: /marketplace
        destination: /marketplace.html
      - type: rewrite
        source: /private-chat
        destination: /private-chat.html
      - type: rewrite
        source: /profile
        destination: /profile.html
    headers:
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /favicon.svg
        name: Cache-Control
        value: no-cache
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache
    previews:
      generation: automatic

  # Node WebSocket fanout
  - type: web
    name: chaines-chat-ws
    runtime: node
    repo: https://github.com/SECUREA1/CHAINES.IO-CHAT.git
    rootDir: ws-server
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: VISIT_NOTIFICATION_EMAIL
        value: chadolthofedx@gmail.com
      - key: VISIT_NOTIFICATION_PHONE
        value: "+15194760080"
      - key: RESEND_API_KEY
        sync: false
      - key: RECEIPT_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
